<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 380" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="500" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284c7" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#059669" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="100" y1="50" x2="400" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0284c7"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow" x="50" y="30" width="400" height="320" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Mesh & Grid -->
  <rect width="500" height="380" rx="20" fill="url(#bgGrad)"/>
  <circle cx="90" cy="80" r="60" fill="#0284c7" fill-opacity="0.06"/>
  <circle cx="420" cy="300" r="80" fill="#059669" fill-opacity="0.06"/>

  <!-- Main Card -->
  <g filter="url(#shadow)">
    <rect x="80" y="60" width="340" height="240" rx="16" fill="url(#cardGrad)" stroke="#e2e8f0" stroke-width="2"/>
  </g>

  <!-- Card Header -->
  <rect x="80" y="60" width="340" height="42" rx="16" fill="#f1f5f9"/>
  <circle cx="106" cy="81" r="5" fill="#ef4444"/>
  <circle cx="122" cy="81" r="5" fill="#f59e0b"/>
  <circle cx="138" cy="81" r="5" fill="#10b981"/>
  <rect x="160" y="74" width="120" height="14" rx="4" fill="#e2e8f0"/>

  <!-- Graphical Elements Inside Card -->
  <!-- Fast Response Beacon -->
  <rect x="110" y="125" width="48" height="48" rx="12" fill="url(#accentGrad)"/>
  <path d="M124 149l7 7 14-14" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  
  <rect x="175" y="132" width="160" height="12" rx="4" fill="#0f172a" fill-opacity="0.8"/>
  <rect x="175" y="152" width="210" height="8" rx="3" fill="#94a3b8"/>
  <rect x="175" y="165" width="140" height="8" rx="3" fill="#cbd5e1"/>

  <!-- Security Shield & Lock Badge -->
  <rect x="110" y="200" width="280" height="65" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
  <circle cx="138" cy="232" r="16" fill="#dcfce7"/>
  <path d="M138 223v6m-4 5h8a2 2 0 012 2v6a2 2 0 01-2 2h-8a2 2 0 01-2-2v-6a2 2 0 012-2z" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <text x="168" y="228" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#15803d">256-Bit TLS &amp; Parameterized Encryption</text>
  <text x="168" y="244" font-family="system-ui, sans-serif" font-size="11" fill="#166534">Anti-Bot Honeypot + CSRF Double-Submit Active</text>

  <!-- Floating Graphic Accents -->
  <g transform="translate(380, 40)">
    <rect width="90" height="34" rx="17" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" filter="url(#shadow)"/>
    <circle cx="17" cy="17" r="5" fill="#10b981"/>
    <text x="28" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0284c7">&lt; 24h Reply</text>
  </g>

  <g transform="translate(30, 270)">
    <rect width="115" height="34" rx="17" fill="#ffffff" stroke="#059669" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="16" y="21" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#059669">✓ 100% Guaranteed</text>
  </g>
</svg>
