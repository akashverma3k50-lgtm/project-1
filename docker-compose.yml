version: '3.8'

services:
  # Nginx Reverse Proxy & Load Balancer
  load_balancer:
    image: nginx:alpine
    container_name: apex_load_balancer
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
      app3:
        condition: service_healthy
    networks:
      - web_net

  # Application Replica 1
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_app_1
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/usr/src/app/data/app.db
    volumes:
      - db_data:/usr/src/app/data
    networks:
      - web_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Application Replica 2
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_app_2
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/usr/src/app/data/app.db
    volumes:
      - db_data:/usr/src/app/data
    networks:
      - web_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Application Replica 3
  app3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: apex_app_3
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_PATH=/usr/src/app/data/app.db
    volumes:
      - db_data:/usr/src/app/data
    networks:
      - web_net
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 384M
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health | grep UP || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  db_data:
    driver: local

networks:
  web_net:
    driver: bridge
