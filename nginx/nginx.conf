# ==============================================================================
# Nginx Reverse Proxy, Load Balancer & Edge Caching Configuration
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Performance & Optimization
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off; # Suppress Nginx version banner for security

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones (DDoS / Brute-force protection)
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=contact_limit:10m rate=2r/s;

    # Proxy Caching Zone (Edge CDN Simulation)
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATIC_CACHE:10m max_size=1g inactive=60m use_temp_path=off;

    # Server-Side Load Balancing Upstream Pool
    # Distributes incoming traffic across 3 application instances using least connections
    upstream app_cluster {
        least_conn;
        server app1:3000 max_fails=3 fail_timeout=10s;
        server app2:3000 max_fails=3 fail_timeout=10s;
        server app3:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # Redirect all HTTP traffic to HTTPS (Enforce HTTPS)
    server {
        listen 80;
        server_name _;

        # ACME challenge for Let's Encrypt certificates
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS Server with SSL Termination & Security Headers
    server {
        listen 443 ssl http2;
        server_name localhost;

        # Self-signed / Production SSL certificates
        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        # Enterprise HTTP Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Static Assets with Edge Caching
        location ~* \.(css|js|svg|png|jpg|jpeg|webp|ico|woff|woff2)$ {
            proxy_pass http://app_cluster;
            proxy_cache STATIC_CACHE;
            proxy_cache_valid 200 304 60m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            add_header X-Cache-Status $upstream_cache_status;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Contact API Endpoint with Dedicated Rate Limiting
        location /api/contact {
            limit_req zone=contact_limit burst=5 nodelay;
            proxy_pass http://app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # General Proxy Pass to Load Balanced Upstream
        location / {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://app_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
